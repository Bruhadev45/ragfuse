[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragfuse"
version = "0.1.0"
description = "Weighted Reciprocal Rank Fusion for hybrid retrieval, with provenance and no dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kandimalla Bruhadev", email = "devbruha@gmail.com" }]
keywords = ["rag", "retrieval", "rrf", "reciprocal-rank-fusion", "hybrid-search", "bm25", "information-retrieval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Bruhadev45/ragfuse"
Repository = "https://github.com/Bruhadev45/ragfuse"
Issues = "https://github.com/Bruhadev45/ragfuse/issues"
Changelog = "https://github.com/Bruhadev45/ragfuse/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ragfuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ragfuse --cov-report=term-missing --cov-fail-under=90 --doctest-modules --strict-markers"

[tool.coverage.run]
source = ["src/ragfuse"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ragfuse"]
